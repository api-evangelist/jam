aid: jam
name: Jam
description: >-
  Jam is a bug-reporting and debugging-telemetry tool for software teams. Its
  Chrome extension and iOS app capture one-click bug reports that bundle a screen
  recording or screenshot together with console logs, network requests, user
  events, and device metadata, so engineers can reproduce and fix issues without
  chasing repro steps. Jam adds Instant Replay (the last two minutes of activity),
  Recording Links for collecting captures from anyone with no install, and routes
  reports into GitHub, GitLab, Jira, Linear, Slack, Notion, Sentry and other tools.
  For developers and AI agents Jam exposes a hosted MCP server, a first-party CLI,
  a JavaScript SDK (jam.metadata()), and Standard Webhooks. Used by 200,000+ people
  across QA, product, engineering, and support.
