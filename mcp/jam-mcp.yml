source: https://jam.dev/docs/jam-mcp
server:
  name: Jam
  transport: http          # streamable HTTP + SSE
  url: https://mcp.jam.dev/mcp
auth:
  type: oauth2
  authorization_server: https://api.jam.dev
  scopes: [mcp:read, mcp:write]
  pkce: S256
  alt: Personal Access Token (jam_pat_ prefix) as Bearer header for headless/CI
  well_known:
    - well-known/jam-oauth-authorization-server.json
    - well-known/jam-oauth-protected-resource.json
install:
  claude_code: claude mcp add Jam https://mcp.jam.dev/mcp -t http -s user
  cursor: '{ "mcpServers": { "jam": { "url": "https://mcp.jam.dev/mcp" } } }'
